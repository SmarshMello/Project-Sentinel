<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Sociology Vocab Practice</title>
<style>
*{box-sizing:border-box}
:root{--bg:#0a1020;--panel:#121a30;--panel2:#17223f;--text:#f7f9ff;--muted:#aab6d6;--accent:#8aa2ff;--good:#55d98b;--bad:#ff7580;--border:#2b385e}
body{margin:0;background:linear-gradient(180deg,#111a33 0%,var(--bg) 45%,#070b14 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh}
main{max-width:900px;margin:0 auto;padding:18px 14px 44px}h1{margin:6px 0 4px;font-size:34px;line-height:1.05}.sub{color:var(--muted);font-size:14px;margin-bottom:16px}nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}button{appearance:none;-webkit-appearance:none;border:none;border-radius:14px;background:#202b4c;color:white;font-weight:800;font-size:16px;padding:13px 10px;min-height:48px;touch-action:manipulation}button.active{background:var(--accent);color:#071020}button.secondary{background:#1a2441}button.good{background:var(--good);color:#07150d}button.bad{background:var(--bad);color:#23090d}.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--border);border-radius:20px;padding:18px;box-shadow:0 18px 50px rgba(0,0,0,.3)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.stat{background:#0f162a;border:1px solid var(--border);border-radius:14px;padding:9px;text-align:center}.stat b{font-size:21px}.small{font-size:12px;color:var(--muted)}.progress{height:9px;border-radius:999px;background:#0a1020;overflow:hidden;margin:10px 0 14px}#progressBar{height:100%;width:0;background:var(--accent);transition:width .2s ease}.questionLabel{font-size:12px;color:var(--muted);font-weight:800;letter-spacing:.08em}.big{font-size:30px;line-height:1.15;font-weight:900;margin:18px 0}.definition{font-size:19px;line-height:1.48;margin:18px 0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.optionList{display:grid;gap:9px;margin-top:14px}.option{text-align:left;background:#0f172b;border:1px solid var(--border)}.option.correct{outline:2px solid var(--good)}.option.wrong{outline:2px solid var(--bad)}input{width:100%;font-size:18px;padding:14px;border-radius:14px;border:1px solid var(--border);background:#0d1528;color:white;outline:none}input:focus{border-color:var(--accent)}.feedback{min-height:28px;font-weight:900;margin-top:12px}.answerBox{margin-top:14px;padding:14px;border-radius:14px;background:#0d1528;border:1px solid var(--border);font-size:17px;line-height:1.45}.hidden{display:none!important}#flashTap{min-height:290px;display:flex;flex-direction:column;justify-content:center;user-select:none;-webkit-user-select:none}.footerButtons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}@media(max-width:600px){h1{font-size:30px}.big{font-size:27px}.definition{font-size:18px}}
</style>
</head>
<body>
<main>
<div class="small">Unit 1 • Foundations of Sociology</div><h1>Sociology Vocab Practice</h1><div class="sub">48 terms • built for phone/iPad</div>
<nav><button id="btnFlash" class="active" type="button">Flashcards</button><button id="btnMC" type="button">Multiple Choice</button><button id="btnType" type="button">Type Answer</button></nav>
<div class="stats"><div class="stat"><b id="correctCount">0</b><br><span class="small">Correct</span></div><div class="stat"><b id="answeredCount">0</b><br><span class="small">Answered</span></div><div class="stat"><b id="accuracyCount">0%</b><br><span class="small">Accuracy</span></div></div><div class="progress"><div id="progressBar"></div></div>
<section id="flashSection" class="card"><div id="flashTap"><div class="questionLabel" id="flashLabel">TERM</div><div class="big" id="flashMain"></div><div class="definition hidden" id="flashBack"></div><div class="small">Tap the card to reveal the answer.</div></div><div class="actions"><button id="needPractice" class="bad" type="button">Need Practice</button><button id="knowIt" class="good" type="button">I Know It</button></div><div class="footerButtons"><button id="shuffleBtn" class="secondary" type="button">Shuffle</button><button id="nextFlash" class="secondary" type="button">Next</button></div></section>
<section id="mcSection" class="card hidden"><div class="questionLabel">WHICH TERM MATCHES THIS DEFINITION?</div><div class="definition" id="mcQuestion"></div><div class="optionList" id="mcOptions"></div><div class="feedback" id="mcFeedback"></div><button id="nextMC" class="secondary" type="button" style="width:100%;margin-top:8px">Next Question</button></section>
<section id="typeSection" class="card hidden"><div class="questionLabel">TYPE THE TERM</div><div class="definition" id="typeQuestion"></div><input id="typeInput" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Type the vocab term"><div class="feedback" id="typeFeedback"></div><div id="typeAnswer" class="answerBox hidden"></div><div class="actions"><button id="checkType" class="good" type="button">Check</button><button id="showType" class="secondary" type="button">Show Answer</button></div><button id="nextType" class="secondary" type="button" style="width:100%;margin-top:8px">Next Question</button></section>
</main>
<script>
(function(){"use strict";const terms=[{"term":"Sociological perspective (imagination)","definition":"The social context in which people live and how those contexts influence people's lives."},{"term":"Structural functionalism","definition":"A theoretical perspective that views society as a whole unit made up of interrelated parts that work together."},{"term":"Society","definition":"People who share a culture and a territory."},{"term":"Social location","definition":"The place an individual or group occupies in society based on social and demographic factors such as race, ethnicity, social class, age, and sex."},{"term":"Generalization","definition":"A statement that applies to a broad category of people or situations."},{"term":"Common sense","definition":"Everyday ideas people assume are true based on experience rather than systematic scientific evidence."},{"term":"Scientific method","definition":"The use of objective, systematic observations to test theories."},{"term":"Positivism","definition":"The application of the scientific approach to the social world."},{"term":"Sociology","definition":"The scientific study of society and human behavior."},{"term":"Class conflict","definition":"The struggle between social classes over resources, power, and control."},{"term":"Social integration","definition":"The degree to which people feel connected to and participate in their social group or society."},{"term":"Values","definition":"Standards by which people define what is desirable or undesirable, good or bad."},{"term":"Objectivity","definition":"Remaining neutral and allowing evidence rather than personal bias to guide conclusions."},{"term":"Latent function","definition":"An unintended consequence of people's actions that helps a social system adjust or continue."},{"term":"Manifest function","definition":"An intended consequence of people's actions that helps some part of a social system."},{"term":"Replication","definition":"Repeating a study to see whether the same results can be obtained again."},{"term":"Verstehen","definition":"A German word meaning 'to understand' or 'to grasp by insight.'"},{"term":"Social facts","definition":"Patterns of behavior and social conditions that exist outside individuals and shape their actions."},{"term":"Symbolic interactionism","definition":"A theoretical perspective in which society is viewed as composed of symbols people use to establish meaning, develop views of the world, and communicate."},{"term":"Theory","definition":"A general statement about how parts of the world fit together and how they work."},{"term":"Conflict theory","definition":"A theoretical framework in which society is viewed as groups competing for scarce resources, power, and influence."},{"term":"Macro analysis","definition":"An examination of large-scale patterns of society."},{"term":"Micro analysis","definition":"An examination of small-scale patterns of society, especially social interaction."},{"term":"Social interaction","definition":"What people do when they are in one another's presence and how they act and react to each other."},{"term":"Globalization","definition":"The growing interconnections among nations due to the expansion of capitalism."},{"term":"Hypothesis","definition":"A statement of how variables are expected to be related to one another, often according to predictions from a theory."},{"term":"Variable","definition":"A factor that varies or changes."},{"term":"Operational definition","definition":"The way in which a researcher measures a variable."},{"term":"Research method","definition":"A procedure sociologists use to collect data, such as surveys, participant observation, case studies, secondary analysis, documents, experiments, and unobtrusive measures."},{"term":"Experiment","definition":"The use of control and experimental groups and dependent and independent variables to test causation."},{"term":"Validity","definition":"The extent to which a measure actually measures what it is intended to measure."},{"term":"Reliability","definition":"The extent to which research produces consistent results when repeated."},{"term":"Survey","definition":"A research method in which people are asked questions about their attitudes, opinions, or behaviors."},{"term":"Population","definition":"A target group to be studied."},{"term":"Random sample","definition":"A sample in which everyone in the target population has the same chance of being included in the study."},{"term":"Sample","definition":"A smaller group selected from a population to represent the larger group."},{"term":"Respondents","definition":"People who answer questions in a survey or interview."},{"term":"Questionnaires","definition":"A list of questions to be asked of respondents."},{"term":"Interview","definition":"A research method in which a researcher asks respondents questions directly."},{"term":"Interviewer bias","definition":"Effects of interviewers on respondents that lead to biased answers."},{"term":"Closed-ended questions","definition":"Questions followed by a list of possible answers from which respondents choose."},{"term":"Open-ended questions","definition":"Questions that respondents answer in their own words."},{"term":"Participant observation (fieldwork)","definition":"A research method in which the researcher participates in a setting while observing what happens."},{"term":"Case study","definition":"An intensive analysis of a single event, situation, group, or individual."},{"term":"Experimental group","definition":"The group of subjects in an experiment who are exposed to the independent variable."},{"term":"Control group","definition":"The group of subjects in an experiment who are not exposed to the independent variable and are used for comparison."},{"term":"Independent variable","definition":"The factor in an experiment that is deliberately changed by the researcher."},{"term":"Dependent variable","definition":"The factor in an experiment that changes as a result of the independent variable."}];let order=terms.map((_,i)=>i),flashIndex=0,flashShowingAnswer=false,correct=0,answered=0,mcIndex=0,mcLocked=false,typeIndex=0,typeLocked=false;const $=id=>document.getElementById(id);function shuffleArray(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function randomIndex(){return Math.floor(Math.random()*terms.length)}function normalize(s){return String(s).toLowerCase().replace(/\(fieldwork\)/g,"").replace(/[^a-z0-9]+/g," ").trim()}function updateStats(){$("correctCount").textContent=correct;$("answeredCount").textContent=answered;$("accuracyCount").textContent=answered?Math.round(correct/answered*100)+"%":"0%";$("progressBar").style.width=Math.min(100,answered/terms.length*100)+"%"}function showMode(mode){$("flashSection").classList.toggle("hidden",mode!=="flash");$("mcSection").classList.toggle("hidden",mode!=="mc");$("typeSection").classList.toggle("hidden",mode!=="type");$("btnFlash").classList.toggle("active",mode==="flash");$("btnMC").classList.toggle("active",mode==="mc");$("btnType").classList.toggle("active",mode==="type");if(mode==="mc")makeMC();if(mode==="type")makeType()}function renderFlash(){const item=terms[order[flashIndex]];flashShowingAnswer=false;$("flashLabel").textContent="TERM";$("flashMain").textContent=item.term;$("flashMain").classList.remove("hidden");$("flashBack").textContent=item.definition;$("flashBack").classList.add("hidden")}function flipFlash(){flashShowingAnswer=!flashShowingAnswer;$("flashLabel").textContent=flashShowingAnswer?"DEFINITION":"TERM";$("flashMain").classList.toggle("hidden",flashShowingAnswer);$("flashBack").classList.toggle("hidden",!flashShowingAnswer)}function advanceFlash(v){if(v===true){correct++;answered++}if(v===false)answered++;updateStats();flashIndex=(flashIndex+1)%order.length;renderFlash()}function makeMC(){mcLocked=false;mcIndex=randomIndex();$("mcQuestion").textContent=terms[mcIndex].definition;$("mcFeedback").textContent="";const c=[mcIndex];while(c.length<4){const r=randomIndex();if(!c.includes(r))c.push(r)}shuffleArray(c);const box=$("mcOptions");box.innerHTML="";c.forEach(i=>{const b=document.createElement("button");b.type="button";b.className="option";b.textContent=terms[i].term;b.addEventListener("click",()=>answerMC(i,b));box.appendChild(b)})}function answerMC(i,b){if(mcLocked)return;mcLocked=true;answered++;[...$("mcOptions").querySelectorAll("button")].forEach(x=>{if(x.textContent===terms[mcIndex].term)x.classList.add("correct")});if(i===mcIndex){correct++;$("mcFeedback").textContent="✓ Correct";$("mcFeedback").style.color="var(--good)"}else{b.classList.add("wrong");$("mcFeedback").textContent="✗ Correct answer: "+terms[mcIndex].term;$("mcFeedback").style.color="var(--bad)"}updateStats()}function makeType(){typeLocked=false;typeIndex=randomIndex();$("typeQuestion").textContent=terms[typeIndex].definition;$("typeInput").value="";$("typeFeedback").textContent="";$("typeAnswer").classList.add("hidden")}function checkType(){if(typeLocked)return;const guess=normalize($("typeInput").value);if(!guess){$("typeFeedback").textContent="Type an answer first.";return}typeLocked=true;answered++;const answer=normalize(terms[typeIndex].term);const accepted=guess===answer||(answer.startsWith("sociological perspective")&&guess==="sociological perspective")||(answer.startsWith("participant observation")&&guess==="participant observation");if(accepted){correct++;$("typeFeedback").textContent="✓ Correct";$("typeFeedback").style.color="var(--good)"}else{$("typeFeedback").textContent="✗ Not quite";$("typeFeedback").style.color="var(--bad)";$("typeAnswer").textContent="Correct answer: "+terms[typeIndex].term;$("typeAnswer").classList.remove("hidden")}updateStats()}function showTypeAnswer(){$("typeAnswer").textContent="Correct answer: "+terms[typeIndex].term;$("typeAnswer").classList.remove("hidden")}$("btnFlash").addEventListener("click",()=>showMode("flash"));$("btnMC").addEventListener("click",()=>showMode("mc"));$("btnType").addEventListener("click",()=>showMode("type"));$("flashTap").addEventListener("click",flipFlash);$("needPractice").addEventListener("click",()=>advanceFlash(false));$("knowIt").addEventListener("click",()=>advanceFlash(true));$("nextFlash").addEventListener("click",()=>advanceFlash(null));$("shuffleBtn").addEventListener("click",()=>{shuffleArray(order);flashIndex=0;renderFlash()});$("nextMC").addEventListener("click",makeMC);$("checkType").addEventListener("click",checkType);$("showType").addEventListener("click",showTypeAnswer);$("nextType").addEventListener("click",makeType);$("typeInput").addEventListener("keydown",e=>{if(e.key==="Enter")checkType()});shuffleArray(order);renderFlash();makeMC();makeType();updateStats()})();
</script>
</body>
</html>
