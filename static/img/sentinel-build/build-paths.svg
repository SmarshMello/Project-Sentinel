<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">Free and paid Sentinel build paths</title><desc id="d">Both paths share the GTA Legacy and LSPDFR foundation, then use Policing Redefined. The free path uses NexusMDT Lite, AIDispatch, and NPCI. The paid path uses NexusMDT Full, Nexus Dispatch, and NPCAI.</desc><style>text{font-family:Arial,sans-serif;fill:#e8eef8}.box{fill:#152238;stroke:#42b8ff;stroke-width:3}.shared{fill:#173328;stroke:#53d18a;stroke-width:3}.arrow{stroke:#8da2bd;stroke-width:5;fill:none;marker-end:url(#a)}.small{font-size:23px}.big{font-size:31px;font-weight:bold}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8da2bd"/></marker></defs><rect width="1200" height="520" rx="26" fill="#0b1220"/><rect class="shared" x="350" y="35" width="500" height="105" rx="18"/><text class="big" x="600" y="78" text-anchor="middle">Shared clean foundation</text><text class="small" x="600" y="112" text-anchor="middle">Legacy 3889 · LSPDFR 9695 · RPH · OpenIV · limits</text><path class="arrow" d="M520 140 L330 225"/><path class="arrow" d="M680 140 L870 225"/><rect class="box" x="65" y="225" width="470" height="245" rx="22"/><text class="big" x="300" y="275" text-anchor="middle">FREE COMMUNITY BUILD</text><text class="small" x="300" y="320" text-anchor="middle">Policing Redefined + Damage Tracker</text><text class="small" x="300" y="360" text-anchor="middle">NexusMDT Lite 0.3.1</text><text class="small" x="300" y="400" text-anchor="middle">AIDispatch 1.0 + NPCI 2.1</text><text class="small" x="300" y="440" text-anchor="middle">No paid membership required</text><rect class="box" x="665" y="225" width="470" height="245" rx="22"/><text class="big" x="900" y="275" text-anchor="middle">PAID MAXIMUM REALISM</text><text class="small" x="900" y="320" text-anchor="middle">Policing Redefined + Damage Tracker</text><text class="small" x="900" y="360" text-anchor="middle">NexusMDT FULL + Nexus Dispatch</text><text class="small" x="900" y="400" text-anchor="middle">NPCAI 3.1 + optional AxonSignal</text><text class="small" x="900" y="440" text-anchor="middle">Entitlements remain with their creators</text></svg>